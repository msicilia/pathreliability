[project]
name = "pathreliability"
version = "0.2.0"
description = "Reliability audit and abstention gate for frozen image encoders."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.9",
    "joblib>=1.4",
    "pillow>=10.0",
]

[project.optional-dependencies]
# needed only to run models: an adapter brings its own framework; this extra
# enables the --builtin timm:<name> and torchvision:<name> wrappers
torch = ["torch", "torchvision", "timm"]
test = ["pytest"]

[project.scripts]
pathreliability = "pathreliability.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pathreliability*"]

[tool.setuptools.package-data]
pathreliability = ["reference.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
